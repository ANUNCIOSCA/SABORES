name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          gradle :app:assembleRelease :generador:assembleRelease :veterinaria:assembleRelease --continue --console=plain 2>&1 | tee build.log

      - name: Publish result to branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || echo "no log" > out/build.log
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/AgendaWA-v2.5.0.apk
            echo "AgendaWA OK" > out/status.txt
          else
            echo "AgendaWA FAIL" > out/status.txt
          fi
          if [ -f generador/build/outputs/apk/release/generador-release.apk ]; then
            cp generador/build/outputs/apk/release/generador-release.apk out/Reportalo24-Generador-v1.10.0.apk
            echo "Generador OK" >> out/status.txt
          else
            echo "Generador FAIL" >> out/status.txt
          fi
          if [ -f veterinaria/build/outputs/apk/release/veterinaria-release.apk ]; then
            cp veterinaria/build/outputs/apk/release/veterinaria-release.apk out/AgendaVeterinaria-v1.0.0.apk
            echo "Veterinaria OK" >> out/status.txt
          else
            echo "Veterinaria FAIL" >> out/status.txt
          fi
          cd out
          git init -q -b ci-output
          git config user.email "ci@agendawa"
          git config user.name "CI"
          git add -A
          git commit -q -m "CI output ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-output:agendawa-ci-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APKs
          path: out/
